
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teste de conexão — PDP</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 650px;
      margin: 50px auto;
      padding: 20px;
      background: #f4f6f8;
      color: #243247;
    }
    main {
      background: white;
      padding: 28px;
      border-radius: 12px;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border-radius: 6px;
    }
    input { border: 1px solid #bbb; }
    button {
      border: 0;
      background: #0756a5;
      color: white;
      cursor: pointer;
    }
    pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #eef2f6;
      padding: 12px;
    }
  </style>
</head>
<body>
<main>
  <h2>People Development Portal</h2>
  <p>Diagnóstico de conexão com Power Automate</p>

  <label for="url">URL HTTP do fluxo de teste</label>
  <input id="url" type="password"
         placeholder="Cole a URL do fluxo aqui"
         autocomplete="off">

  <button id="testar">Testar conexão</button>
  <pre id="resultado">Aguardando teste...</pre>
</main>

<script>
document.getElementById("testar").addEventListener("click", async () => {
  const url = document.getElementById("url").value.trim();
  const resultado = document.getElementById("resultado");
  const botao = document.getElementById("testar");

  if (!url.startsWith("https://")) {
    resultado.textContent = "Informe uma URL HTTPS válida.";
    return;
  }

  botao.disabled = true;
  resultado.textContent = "Enviando solicitação...";

  try {
    const resposta = await fetch(url, {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=UTF-8"
      },
      body: JSON.stringify({
        acao: "teste",
        mensagem: "Conexao PDP"
      })
    });

    const corpo = await resposta.text();

    resultado.textContent =
      "Status HTTP: " + resposta.status +
      "\nResposta: " + corpo;
  } catch (erro) {
    resultado.textContent =
      "A solicitação não pôde ser concluída pelo navegador.\n" +
      "Possíveis causas: CORS, rede ou URL do fluxo.\n" +
      "Detalhe: " + erro.message;
  } finally {
    botao.disabled = false;
  }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>TV Corporativa</title>

    <meta
        http-equiv="Cache-Control"
        content="no-cache, no-store, must-revalidate"
    >

    <meta
        http-equiv="Pragma"
        content="no-cache"
    >

    <meta
        http-equiv="Expires"
        content="0"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <!-- =====================================================
         PLAYER DA TV
    ====================================================== -->

    <main id="tvApp">

        <div id="playerContainer">

            <!-- VÍDEO -->

            <video
                id="videoPlayer"
                autoplay
                muted
                playsinline
                webkit-playsinline
                preload="auto"
                disablePictureInPicture
            ></video>


            <!-- IMAGEM / COMUNICADO -->

            <img
                id="imagePlayer"
                alt=""
            >


            <!-- POWER BI / WEB -->

            <iframe
                id="webPlayer"
                frameborder="0"
                allowfullscreen
            ></iframe>


            <!-- MENSAGEM DE CARREGAMENTO -->

            <div id="loading">

                <div class="loadingBox">

                    <div class="loadingIcon">
                        📺
                    </div>

                    <div>
                        Carregando programação...
                    </div>

                </div>

            </div>

        </div>


        <!-- =================================================
             INFORMAÇÃO DA TV
        ================================================= -->

        <div id="tvInfo">

            TV Corporativa

        </div>

    </main>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="js/storage.js"></script>

    <script src="js/database.js"></script>

    <script src="js/player.js"></script>

    <script src="app.js"></script>


</body>

</html>
